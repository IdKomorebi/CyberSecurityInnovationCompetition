<title id="title">整体核对与路径选择</title><desc id="desc">从接收方可见的全部字段出发，重新训练神经网络和梯度提升树；若仍越线，以估计筛选和重训确认逐步撤出字段，在路径上选择累计代价加惩罚最低的位置，再逆序尝试放回。曲线仅示意机制。</desc>
