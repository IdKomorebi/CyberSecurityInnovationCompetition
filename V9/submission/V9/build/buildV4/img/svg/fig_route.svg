<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1270" viewBox="0 0 1000 635" role="img" aria-labelledby="title desc">
<title id="title">技术路线：从字段风险到整套等级</title><desc id="desc">三个阶段依次为字段本身、聚合推断风险、定级与效果。一次等级与单独推断为起点；字段推断风险 M 和最小越线组合共同进入二次定级；通过整体核对与效果复核得到等级和风险变化。推断精度是贯穿三个阶段的共同尺度。图中条形及等级为示意。</desc>
