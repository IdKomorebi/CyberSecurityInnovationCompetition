<text x="37" y="391" font-size="21" fill="#52647a" font-weight="400" text-anchor="start"><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">共同前提：</tspan><tspan font-family="DejaVu Sans,Arial,sans-serif">V </tspan><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">单调，</tspan><tspan font-family="DejaVu Sans,Arial,sans-serif">V(∅) = 0</tspan><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">。前两条关系限定组合规模</tspan><tspan font-family="DejaVu Sans,Arial,sans-serif"> ≤ K + 1</tspan><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">。</tspan></text>
