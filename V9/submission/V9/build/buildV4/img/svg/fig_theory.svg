<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1700" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
<title id="title">字段推断风险与越线组合的关系</title><desc id="desc">上半图以 NEM 风电预测示例区分字段 M 与实际越线组合。中部用三条关系说明二者一致：成员 M 之和约束组合精度；关键字段等价于属于最小越线组合；组合的不可约增益不超过任何成员在相应预算下的 M。下部说明二者在定级中承担不同作用。</desc>
