<text x="376" y="687" font-size="24" fill="#087e86" font-weight="600" text-anchor="start"><tspan font-family="DejaVu Sans,Arial,sans-serif">V(E) − max V(E′) ≤ minⱼ Mⱼ⁽|ᴱ|⁻¹⁾</tspan></text>
<text x="376" y="725" font-size="20" fill="#52647a" font-weight="400" text-anchor="start"><tspan font-family="DejaVu Sans,Arial,sans-serif">E′ </tspan><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">为真子集，</tspan><tspan font-family="DejaVu Sans,Arial,sans-serif">|E| ≥ 2</tspan><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">；强协同需要每个成员的</tspan><tspan font-family="DejaVu Sans,Arial,sans-serif"> M </tspan><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">足够大。</tspan></text>
