<text x="376" y="483" font-size="22" fill="#52647a" font-weight="400" text-anchor="start"><tspan font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif">成员风险之和，为组合推断能力提供上界。</tspan></text>
