# 01 号：稀疏门控能否把“有推断作用”的字段找全（事先写定的问题与判据）
问题: >
  原稀疏门控找的是“够用的最小推断来源”，起冗余作用的字段会被压掉。
  用它来圈定“有关字段”时，需要的是只要有作用就留下。比较几种改法。
方法:
  A_原门控: 惩罚系数 0.005，单轮
  B_逐轮剥离: 原门控逐轮剥离，直到剩余字段推断精度不超过 0.7，取各轮并集（电碳作品的做法）
  C_低惩罚: 惩罚系数 0.0005，单轮
  D_随机屏蔽: 训练时每条样本随机屏蔽一部分候选字段，惩罚系数 0.005
  E_随机屏蔽低惩罚: 随机屏蔽 + 惩罚系数 0.0005
数据与真值:
  PJM: 2025 年 3 个时间窗口 × 4 项敏感数据；22 个候选字段 + 2 个公开字段；
       真值为逐组合重新训练得到的字段推断敏感度 M（K=2），M ≥ 0.05 记为“有作用”
  社区统计: 3 项敏感数据；真实字段里单独推断精度 ≥ 0.05 的记为“有作用”，
       另加 30 个打乱行序的假字段（必然无作用）用来看误选
判据:
  找全: 有作用字段的找回比例 ≥ 0.95，且漏掉的字段里 M 最大值 ≤ 0.10
  不滥选: 假字段的误选比例 ≤ 0.10
  通过上面两条、并且选出字段最少的方法，作为系统里“圈定范围”的做法
随机种子: [0, 1, 2]
